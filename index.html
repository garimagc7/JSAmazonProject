<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a class="amazon-logo">
            <img src="assets/amazon_logo.png" width="100px" alt="can't load">
        </a>
        <div class="delivery-location">
            <img height="18px" src="assets/location_icon.png">
            <div class="delivery-paragraph">
                <p>Deliver to </p>
                <strong>Nepal</strong>
            </div>
        </div>
        
        <div class="nav-search">
            <div class="nav-search-category">
                <span>All</span>
                <img height="10px" src="assets/dropdown_icon.png">
            </div>
            <input 
            type="text"
            class="nav-search-input" 
            placeholder="Search Amazon">
            <button class="nav-search-button">
            <img src="assets/search_icon.png" alt="Search">
            </button>
        </div>
        <div class="nav-language">
            <img height="25px" src="assets/us_flag.png">
            <strong>EN</strong>
            <img width="10px" src="assets/dropdown_icon.png">
        </div>
        <div class="nav-signin">
            <div class="nav-account">
                <p>Hello, sign in</p> 
                <strong>Account & Lists</strong>
            </div>
            <img width="10px" src="assets/dropdown_icon.png">
        </div>
        <div class="nav-orders">
            <p>Returns<p>
           <strong>& Orders</strong>
        </div>
        <button class="nav-cart">
            <img width="32px" src="assets/cart_icon.png">Cart
        </button>
    </nav>
    <nav class="nav-bottom">
        <a href="#" class="all-menu">
            ☰
            <strong>All</strong>
        </a>
        <a href="#">Today's Deals</a>
        <a href="#">Prime Video</a>
        <a href="#">Gift Cards</a>
        <a href="#">Sell</a>
        <a href="#">Customer Service</a>
        <a href="#">Registry</a>

    </nav>

</body>
</html>
